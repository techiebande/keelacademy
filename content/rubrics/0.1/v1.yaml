id: rubric-0.1
version: 1
pass_rule: all
judge:
  prompt: prompts/judge-0.1.md
  model_tier: mid
golden_set: golden/0.1/
criteria:
  - id: problem-stated-plainly
    description: "The problem section says what is wrong in plain words and gives its size (roughly how many messages a month and how long a customer waits); a reader with no business or software background would understand it."
    evidence: "quote the sentence(s) that state the problem and its size"
  - id: three-people-differ
    description: "Sarah, Michael and Rachel are each named, and what each needs is specific to that person (speed for Sarah, an unchangeable record of every decision for Michael, consistent rules with hard cases reaching a person for Rachel), not a general wish for improvement."
    evidence: "quote one phrase per person that shows the difference"
  - id: current-process-traceable
    description: "The current process is a sequence a reader could follow for one message (read, look up order, look up delivery, check photo or rules, decide, reply, record) and it says where the waiting comes from."
    evidence: "quote the steps or the sentence about where time goes"
  - id: target-process-distinguishes-cases
    description: "The target process says what happens to an easy case (decided and answered quickly) and what happens to a hard case (reaches a person with the facts gathered), and says that decisions are recorded."
    evidence: "quote the easy-case and hard-case sentences and the recording sentence"
  - id: words-and-length
    description: "The words AI, agent, LLM, model, and machine learning do not appear; amounts are plain numbers like 45.00; the brief is roughly 350 to 600 words with the four required headings in order."
    evidence: "state the word count and confirm the banned words are absent, or quote the offending word"
