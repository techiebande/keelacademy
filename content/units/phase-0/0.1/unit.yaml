kind: conceptual
id: "0.1"
phase: 0
est_hours: 1
prereq_units: []
learn: learn.md
practice:
  worked_example: worked-example/
  completion_problem:
    prompt: "Write a client brief for OmniCart Operations covering the current delay, the three leaders, and both process flows."
    instructions: "Draft your brief inside omnicart-system/docs/client-brief.md using the five required headings and whole integer cents."
    rubric: rubrics/0.1/v1.yaml
  retrieval_seeds:
    - "OmniCart handles about 4,000 return requests, damage claims, delivery slips, and payout disputes each month."
    - "Today a dispute sits for 2 to 3 days before review begins."
    - "Operations wants reviews under 1 hour, the CFO wants integer cents tracked, and compliance protects return rules."
    - "Money is always written as integer cents, so 45 dollars and 20 cents becomes 4520 cents."
    - "We describe the business problem in plain words before we choose any fix."
build:
  deliverable: "Submit your client brief document for OmniCart Operations saved to omnicart-system/docs/client-brief.md."
  submission: file
  data_variant: omnicart@v0
verify:
  layers: [2]
  rubric: rubrics/0.1/v1.yaml
gate:
  unlocks: ["0.2"]
unstuck:
  - symptom: "The grader flags a forbidden technology word in my brief"
    fix_ref: faq/0.1.md#forbidden-technology-words
  - symptom: "My problem section has more than three sentences"
    fix_ref: faq/0.1.md#too-many-sentences
  - symptom: "The grader rejects money written as dollars"
    fix_ref: faq/0.1.md#dollar-amounts-instead-of-cents
  - symptom: "My steps list misses one of the four required documents"
    fix_ref: faq/0.1.md#missing-required-documents
